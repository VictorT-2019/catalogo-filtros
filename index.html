<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Catálogo de filtros para aspiradoras</title><style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e3e1da;--ac:#0f6e56;--acx:#fff;--ok:#0f6e56;--okb:#e1f3ec;--no:#8a8a84;--nob:#ecebe6;--wa:#1faa59;--dg:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--sf:#222220;--tx:#f1f0ea;--mu:#a3a29a;--bd:#363632;--ac:#4fc3a1;--acx:#08241b;--ok:#6fd8b8;--okb:#17332a;--no:#9b9a92;--nob:#2c2c29;--dg:#f2b8b5}}
:root[data-theme="dark"]{--bg:#171715;--sf:#222220;--tx:#f1f0ea;--mu:#a3a29a;--bd:#363632;--ac:#4fc3a1;--acx:#08241b;--ok:#6fd8b8;--okb:#17332a;--no:#9b9a92;--nob:#2c2c29;--dg:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0 10px}
input,select,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row label{font-size:.9rem;color:var(--mu);display:flex;gap:6px;align-items:center}
.grp{margin:22px 0 8px;display:flex;gap:12px;align-items:center}
.grp img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:10px}
.grp h2{margin:0;font-size:1.1rem}.grp small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.out .ph{filter:grayscale(1);opacity:.6}
.ph{aspect-ratio:4/3;background:#fff;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.ph img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;cursor:zoom-in}
.bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:600;line-height:1.25}.pn{color:var(--mu);font-size:.85rem;font-variant-numeric:tabular-nums}
.pr{font-size:1.25rem;font-weight:700}.pr small{font-size:.7rem;font-weight:500;color:var(--mu)}
.tag{align-self:flex-start;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--okb);color:var(--ok);font-weight:600}
.tag.no{background:var(--nob);color:var(--no)}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--ac);color:var(--acx);cursor:pointer;font-weight:600;text-align:center;text-decoration:none;display:inline-block}
.btn.wa{background:var(--wa);color:#fff}.btn.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.dg{background:transparent;color:var(--dg);border:1px solid var(--dg)}
.adm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}.adm label{font-size:.72rem;color:var(--mu)}
.adm .btn{grid-column:1/3;padding:6px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.top{background:var(--ac);color:var(--acx);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:25}
.top .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{flex:1;min-width:140px}
.top .btn{background:var(--acx);color:var(--ac);padding:6px 12px}.top .btn:disabled{opacity:.45;cursor:default}
.lb,.md{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.md .box{background:var(--sf);border-radius:14px;padding:16px;width:min(440px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.md h3{margin:0}.md label{font-size:.85rem;color:var(--mu);display:grid;gap:4px}
.foot{color:var(--mu);font-size:.8rem;text-align:center;padding:26px 0 14px}

 if(onlyAv&&!(p.stock>0))return false;
 return !t||norm(p.name+' '+p.pn+' '+m.name).includes(t)})}
function card(p){
 const m=D.models.find(x=>x.id===p.model)||{},out=!(p.stock>0);
 const ph=(p.imgs||[]).map(k=>`<img src="${D.imgs[k]||''}" alt="${esc(p.name)}" loading="lazy" data-zoom="${esc(k)}">`).join('')||'';
 const wa=D.cfg.wa?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(D.cfg.wa)}?text=${encodeURIComponent('Hola, me interesa: '+p.name+' (No. de parte '+p.pn+') para '+m.name)}">Pedir por WhatsApp</a>`:'';
 const ad=admin?`<div class="adm"><label>Precio<input type="number" min="0" data-f="price" data-id="${p.id}" value="${p.price}"></label>
 <label>Existencia<input type="number" min="0" data-f="stock" data-id="${p.id}" value="${p.stock}"></label>
 <button class="btn gh" data-edit="${p.id}">Editar pieza</button></div>`:'';
 return `<div class="card ${out?'out':''}"><div class="ph">${ph}</div><div class="bd"><div class="nm">${esc(p.name)}</div>
 <div class="pn">No. de parte: ${esc(p.pn)}</div><div class="pr">${money(p.price)} <small>MXN</small></div>
 <span class="tag ${out?'no':''}">${out?'Agotado':'Disponible'}${admin&&!out?' ('+p.stock+')':''}</span>${admin?ad:(out?'':wa)}</div></div>`}
function render(){
 const act=document.activeElement,keep=act&&act.id==='q'?act.selectionStart:null;
 const list=visible(),groups=D.models.filter(m=>list.some(p=>p.model===m.id));
 let h='';
 if(admin)h+=`<div class="top"><div class="in"><b>Modo administrador${dirty?' · cambios sin publicar':''}</b>
  <button class="btn" id="add">+ Agregar pieza</button><button class="btn" id="set">Ajustes</button>
  <button class="btn" id="pub" ${dirty?'':'disabled'}>Publicar cambios</button></div></div>`;
 h+=`<div class="wrap"><h1>${esc(D.cfg.store)}</h1><p class="sub">Toca una foto para verla en grande. Precios en pesos mexicanos.</p>
 <div class="bar"><input id="q" type="search" placeholder="Buscar por nombre, número de parte o modelo…" value="${esc(q)}">
 <div class="chips"><button class="chip ${mf==='all'?'on':''}" data-m="all">Todos</button>${D.models.map(m=>`<button class="chip ${mf===m.id?'on':''}" data-m="${m.id}">${esc(m.name)}</button>`).join('')}</div>
 <div class="row"><label><input type="checkbox" id="av" ${onlyAv?'checked':''}> Solo disponibles</label><span class="sub" style="margin:0">${list.length} pieza${list.length===1?'':'s'}</span></div></div>`;
 h+=groups.length?groups.map(m=>`<div class="grp">${D.imgs[m.img]?`<img src="${D.imgs[m.img]}" alt="">`:''}<div><h2>${esc(m.name)}</h2><small>${esc(m.type)}</small></div></div>
  <div class="grid">${list.filter(p=>p.model===m.id).map(card).join('')}</div>`).join(''):'<div class="empty">No encontramos piezas con esa búsqueda.</div>';
 h+=`<div class="foot">${esc(msg)}</div></div>`;
 $('#root').innerHTML=h;
 if(keep!==null){const i=$('#q');i.focus();i.setSelectionRange(keep,keep)}
}
function modal(html){const d=document.createElement('div');d.className='md';d.innerHTML='<div class="box">'+html+'</div>';
 d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);return d}
function resize(file,mx=600){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
 const s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}
function editor(id){
 const isNew=!id,p=isNew?{id:'p'+Date.now(),model:D.models[0]?.id||'',name:'',pn:'',price:0,stock:1,imgs:[]}:D.parts.find(x=>x.id===id);
 let newImg=null;
 const d=modal(`<h3>${isNew?'Agregar pieza':'Editar pieza'}</h3>
 <label>Nombre<input type="text" id="e_n" value="${esc(p.name)}"></label>
 <label>Número de parte<input type="text" id="e_p" value="${esc(p.pn)}"></label>
 <label>Modelo de aspiradora<input type="text" id="e_m" list="ml" value="${esc((D.models.find(m=>m.id===p.model)||{}).name||'')}"><datalist id="ml">${D.models.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist></label>
 <label>Precio (MXN)<input type="number" min="0" id="e_pr" value="${p.price}"></label>
 <label>Existencia<input type="number" min="0" id="e_s" value="${p.stock}"></label>
 <label>${isNew?'Foto':'Reemplazar foto (opcional)'}<input type="file" accept="image/*" id="e_f"></label>
 <div class="row"><button class="btn" id="e_ok">Guardar</button><button class="btn gh" id="e_x">Cancelar</button>${isNew?'':'<button class="btn dg" id="e_d">Eliminar</button>'}</div>`);
 d.querySelector('#e_f').onchange=async e=>{const f=e.target.files[0];if(f)try{newImg=await resize(f)}catch(_){alert('No se pudo leer la imagen.')}};
 d.querySelector('#e_x').onclick=()=>d.remove();
 if(!isNew)d.querySelector('#e_d').onclick=()=>{if(confirm('¿Eliminar esta pieza?')){D.parts=D.parts.filter(x=>x!==p);d.remove();touch()}};
 d.querySelector('#e_ok').onclick=()=>{
  const nm=d.querySelector('#e_n').value.trim();if(!nm){alert('Escribe el nombre de la pieza.');return}
  const mn=d.querySelector('#e_m').value.trim();let m=D.models.find(x=>x.name===mn);
  if(!m&&mn){m={id:'m'+Date.now(),name:mn,type:'Aspiradora',img:''};D.models.push(m)}
  p.name=nm;p.pn=d.querySelector('#e_p').value.trim();p.model=m?m.id:'';p.price=Number(d.querySelector('#e_pr').value)||0;p.stock=Number(d.querySelector('#e_s').value)||0;
  if(newImg){const k='u'+Date.now();D.imgs[k]=newImg;p.imgs=[k]}
  if(isNew)D.parts.push(p);d.remove();touch()}}
function settings(){
 const d=modal(`<h3>Ajustes</h3><label>Título del catálogo<input type="text" id="s_t" value="${esc(D.cfg.store)}"></label>
 <label>WhatsApp con código de país, solo números (ej. 5217771234567)<input type="text" id="s_w" value="${esc(D.cfg.wa)}"></label>
 <div class="row"><button class="btn" id="s_ok">Guardar</button><button class="btn gh" id="s_x">Cancelar</button></div>`);
 d.querySelector('#s_x').onclick=()=>d.remove();
 d.querySelector('#s_ok').onclick=()=>{D.cfg.store=d.querySelector('#s_t').value.trim()||D.cfg.store;D.cfg.wa=d.querySelector('#s_w').value.replace(/\D/g,'');d.remove();touch()}}
async function publish(){
 if(!artifact){alert('No se pudo conectar para publicar. Abre el catálogo desde tu cuenta de Claude.');return}
 const b=$('#pub');b.disabled=true;b.textContent='Publicando…';
 const T='</'+'script>';
 const html='<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(D.cfg.store)+'</title><style id="css">'+$('#css').textContent+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+JSON.stringify(D).replace(/</g,'\\u003c')+T+'<script id="app">'+$('#app').textContent+T+'</body></html>';
 try{await artifact.publish(html)}catch(e){b.disabled=false;b.textContent='Publicar cambios';alert(e&&e.code==='conflict'?'Alguien más publicó cambios. Se recargará la última versión.':'No se pudo publicar: '+((e&&e.message)||'error desconocido'))}}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.m){mf=t.dataset.m;render();return}
 if(t.dataset.zoom){const l=document.createElement('div');l.className='lb';l.innerHTML='<img src="'+D.imgs[t.dataset.zoom]+'" alt="">';l.onclick=()=>l.remove();document.body.appendChild(l);return}
 if(t.dataset.edit){editor(t.dataset.edit);return}
 if(t.id==='add'){editor();return}if(t.id==='set'){settings();return}if(t.id==='pub'){publish()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){q=t.value;render()}
 else if(t.id==='av'){onlyAv=t.checked;render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f){const p=D.parts.find(x=>x.id===t.dataset.id);if(p){p[t.dataset.f]=Math.max(0,Number(t.value)||0);touch()}}});
render();
(async()=>{try{
 if(!window.claude)return;
 const u=await claude.use('user');
 if(u&&u.isOwner()){artifact=await claude.use('artifact');admin=true;render()}
}catch(_){}})();
</script></body></html>
